name: Release

# При каждом пуше в main собираем установщик и публикуем GitHub Release.
# Приложение у пользователей проверяет эти релизы и предлагает обновиться.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web client deps
        run: npm install

      - name: Install desktop deps
        run: npm install
        working-directory: desktop

      - name: Set version
        run: npm version $env:VERSION --no-git-tag-version
        working-directory: desktop

      - name: Build installer
        run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Mix ${{ env.VERSION }}
          body: ${{ github.event.head_commit.message }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            desktop/release/Mix-Setup-${{ env.VERSION }}.exe
            desktop/release/Mix-Setup-${{ env.VERSION }}.exe.blockmap
            desktop/release/latest.yml
