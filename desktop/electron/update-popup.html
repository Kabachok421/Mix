<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Mix: обновление</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; color: #f2f2f7; user-select: none; }
  .card { position: absolute; inset: 8px; border-radius: 14px; background: #15151d;
    border: 1px solid #2c2c3d; box-shadow: 0 8px 28px rgba(0,0,0,.55);
    padding: 14px 16px; display: flex; flex-direction: column; -webkit-app-region: drag; }
  .head { display: flex; gap: 12px; align-items: center; }
  .head img { width: 38px; height: 38px; border-radius: 9px; flex: none; }
  .title { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .text { font-size: 12px; color: #a3a3b8; margin-top: 2px; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 270px; }
  .bar { height: 6px; border-radius: 3px; background: #262636; margin-top: 12px; overflow: hidden; display: none; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 3px;
    background: linear-gradient(90deg, #6366f1, #a855f7); transition: width .25s ease; }
  .actions { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; -webkit-app-region: no-drag; }
  button { font: inherit; font-size: 12.5px; font-weight: 600; border: 0; border-radius: 8px;
    padding: 7px 16px; cursor: pointer; color: #f2f2f7; background: #262636; }
  button:hover { background: #30304a; }
  button.primary { background: linear-gradient(135deg, #6366f1, #a855f7); }
  button.primary:hover { filter: brightness(1.12); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <img src="icon.png" alt="">
    <div>
      <div class="title" id="title">Mix</div>
      <div class="text" id="text"></div>
    </div>
  </div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="actions">
    <button id="secondary">Позже</button>
    <button id="primary" class="primary">Download</button>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const title = $('title'), text = $('text'), bar = $('bar'), fill = $('fill');
  const primary = $('primary'), secondary = $('secondary');

  let phase = 'idle';
  primary.addEventListener('click', () => {
    if (phase === 'downloaded') window.updater.restart();
    else window.updater.download();
  });
  secondary.addEventListener('click', () => window.updater.dismiss());

  function render(s) {
    phase = s.phase;
    bar.style.display = 'none';
    primary.classList.remove('hidden');
    secondary.classList.remove('hidden');
    secondary.textContent = 'Позже';

    if (s.phase === 'available') {
      title.textContent = 'Доступно обновление';
      text.textContent = 'Mix ' + (s.version || '');
      primary.textContent = 'Download';
    } else if (s.phase === 'downloading') {
      title.textContent = 'Загрузка обновления';
      const mb = (s.speed || 0) / 1048576;
      text.textContent = (s.percent || 0) + '%' + (mb > 0.05 ? ' · ' + mb.toFixed(1) + ' МБ/с' : '');
      bar.style.display = 'block';
      fill.style.width = (s.percent || 0) + '%';
      primary.classList.add('hidden');
      secondary.textContent = 'Скрыть';
    } else if (s.phase === 'downloaded') {
      title.textContent = 'Обновление загружено';
      text.textContent = 'Mix ' + (s.version || '') + ' готов к установке';
      primary.textContent = 'Restart';
    } else if (s.phase === 'uptodate') {
      title.textContent = 'Всё актуально';
      text.textContent = 'Установлена последняя версия Mix ' + (s.version || '');
      primary.classList.add('hidden');
      secondary.textContent = 'Закрыть';
    } else if (s.phase === 'error') {
      title.textContent = 'Не удалось обновить';
      text.textContent = s.message || 'Неизвестная ошибка';
      primary.textContent = 'Повторить';
      secondary.textContent = 'Закрыть';
    }
  }
  window.updater.onState(render);
</script>
</body>
</html>
